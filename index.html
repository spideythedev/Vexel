
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111110">
  <meta name="description" content="Vexel Playground — An interactive vector graphics development environment.">

  <title>Vexel Playground</title>
  <link rel="icon" href="vexel.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">

  <style>
    :root {
      color-scheme: dark;

      --bg: #111110;
      --surface: #181817;
      --surface-raised: #201f1e;
      --surface-hover: #292725;
      --border: #302e2b;

      --text: #f5f3f0;
      --secondary: #aaa49d;
      --muted: #77716b;

      --accent: #ff6538;
      --accent-soft: rgba(255, 101, 56, .12);

      --green: #7bd9a2;
      --red: #ff7777;
      --yellow: #f4c46b;
      --blue: #83b9f7;

      --header: 54px;
      --footer: 30px;

      --font: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;

      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;

      --ease: 180ms cubic-bezier(.2,.7,.3,1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .app {
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */

    .header {
      height: var(--header);
      min-height: var(--header);
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 130px;
    }

    .brand img {
      width: 27px;
      height: 27px;
      object-fit: contain;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -.5px;
    }

    .brand-version {
      color: var(--muted);
      font-size: 10px;
      margin-left: 3px;
      font-weight: 500;
    }

    .header-center {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
    }

    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 6px;
      padding: 7px 15px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: var(--ease);
    }

    .tab:hover {
      color: var(--text);
    }

    .tab.active {
      background: var(--surface-hover);
      color: var(--text);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--secondary);
      border-radius: 7px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      transition: var(--ease);
    }

    .btn:hover {
      background: var(--surface-hover);
      color: var(--text);
      border-color: #45413c;
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn.primary:hover {
      background: #ff7953;
      border-color: #ff7953;
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    /* Workspace */

    .workspace {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    .panel {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      min-height: 0;
    }

    .panel.active {
      display: flex;
    }

    /* Editor */

    .editor-panel {
      background: var(--surface);
    }

    .panel-toolbar {
      height: 37px;
      min-height: 37px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .panel-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--secondary);
      font-size: 10px;
      font-weight: 600;
    }

    .file-dot {
      width: 7px;
      height: 7px;
      border-radius: 2px;
      background: var(--yellow);
    }

    .panel-meta {
      font-size: 10px;
      color: var(--muted);
    }

    .editor-container {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .CodeMirror {
      height: 100% !important;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.75;
      background: var(--surface) !important;
    }

    .CodeMirror-gutters {
      background: var(--surface) !important;
      border-right: 1px solid var(--border) !important;
    }

    .CodeMirror-linenumber {
      color: #625d56 !important;
      padding: 0 12px 0 5px;
    }

    .CodeMirror-cursor {
      border-left-color: var(--accent) !important;
    }

    .CodeMirror-selected {
      background: rgba(255, 101, 56, .17) !important;
    }

    .CodeMirror-activeline-background {
      background: rgba(255,255,255,.025) !important;
    }

    /* Output */

    .output-panel {
      background: #faf9f7;
      overflow: hidden;
    }

    .output-toolbar {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px;
      background: rgba(255,255,255,.92);
      border: 1px solid #e7e5e2;
      border-radius: 9px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .canvas-btn {
      width: 32px;
      height: 30px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #49443f;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: var(--ease);
    }

    .canvas-btn:hover {
      background: #eeece9;
      color: #171615;
    }

    .canvas-divider {
      height: 19px;
      width: 1px;
      background: #e5e2df;
      margin: 0 2px;
    }

    .watermark {
      position: absolute;
      bottom: 30px;
      right: 25px;
      opacity: .035;
      pointer-events: none;
    }

    .watermark img {
      width: 150px;
      height: 150px;
      object-fit: contain;
    }

    /* Console */

    .console-panel {
      background: var(--surface);
    }

    .console-header {
      height: 39px;
      min-height: 39px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      border-bottom: 1px solid var(--border);
    }

    .console-title {
      font-size: 11px;
      font-weight: 650;
      color: var(--secondary);
    }

    .console-clear {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      cursor: pointer;
    }

    .console-clear:hover {
      color: var(--text);
    }

    .console-output {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.8;
    }

    .console-line {
      display: flex;
      gap: 12px;
      padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,.025);
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .console-time {
      flex-shrink: 0;
      color: #625d56;
      font-size: 10px;
    }

    .console-message {
      color: var(--secondary);
    }

    .console-line.error .console-message {
      color: var(--red);
    }

    .console-line.warn .console-message {
      color: var(--yellow);
    }

    .console-line.info .console-message {
      color: var(--blue);
    }

    .console-line.success .console-message {
      color: var(--green);
    }

    /* Status bar */

    .statusbar {
      height: var(--footer);
      min-height: var(--footer);
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 10px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
    }

    .status-dot.error {
      background: var(--red);
    }

    .status-right {
      margin-left: auto;
    }

    /* Loader and notifications */

    .loader {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      transition: opacity .3s, visibility .3s;
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
    }

    .loader-ring {
      width: 34px;
      height: 34px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    .loader-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .5px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      bottom: 48px;
      left: 50%;
      transform: translate(-50%, 10px);
      background: #252321;
      border: 1px solid #393530;
      color: var(--text);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transition: var(--ease);
      z-index: 100;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* Responsive */

    @media (max-width: 700px) {
      :root {
        --header: 52px;
      }

      .header {
        padding: 0 9px;
        gap: 8px;
      }

      .brand {
        min-width: auto;
      }

      .brand-name {
        font-size: 13px;
      }

      .brand-version {
        display: none;
      }

      .brand img {
        width: 25px;
        height: 25px;
      }

      .header-center {
        justify-content: flex-start;
      }

      .tabs {
        padding: 3px;
      }

      .tab {
        padding: 7px 10px;
        font-size: 10px;
      }

      .header-actions {
        gap: 4px;
      }

      .header-actions .btn {
        padding: 8px 9px;
        font-size: 10px;
      }

      #newBtn,
      #formatBtn {
        display: none;
      }

      .statusbar {
        gap: 11px;
        padding: 0 9px;
        font-size: 9px;
      }

      .panel-toolbar {
        padding: 0 10px;
      }

      .CodeMirror {
        font-size: 12px;
      }
    }

    @media (max-width: 390px) {
      .header {
        gap: 5px;
      }

      .tab {
        padding: 7px 8px;
      }

      .header-actions .btn {
        padding: 8px;
      }

      .brand img {
        width: 22px;
        height: 22px;
      }

      .statusbar {
        gap: 8px;
      }

      .status-right {
        display: none;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- Loading -->
  <div class="loader" id="loader">
    <div class="loader-content">
      <div class="loader-ring"></div>
      <div class="loader-label">INITIALIZING VEXEL</div>
    </div>
  </div>

  <!-- Header -->
  <header class="header">

    <div class="brand">
      <img src="vexel.png" alt="Vexel">
      <div class="brand-name">
        Vexel <span class="brand-version">PLAYGROUND</span>
      </div>
    </div>

    <div class="header-center">
      <nav class="tabs">
        <button class="tab active" data-panel="code">Code</button>
        <button class="tab" data-panel="output">Output</button>
        <button class="tab" data-panel="console">Console</button>
      </nav>
    </div>

    <div class="header-actions">
      <button class="btn" id="newBtn">New</button>
      <button class="btn" id="formatBtn">Format</button>
      <button class="btn" id="shareBtn">Share</button>
      <button class="btn primary" id="runBtn">
        <span>▶</span> Run
      </button>
    </div>

  </header>

  <!-- Workspace -->
  <main class="workspace">

    <!-- Code -->
    <section class="panel editor-panel active" id="panelCode">

      <div class="panel-toolbar">
        <div class="panel-label">
          <span class="file-dot"></span>
          playground.js
        </div>
        <div class="panel-meta" id="editorInfo">
          JavaScript · Vexel
        </div>
      </div>

      <div class="editor-container" id="editorContainer"></div>

    </section>

    <!-- Output -->
    <section class="panel output-panel" id="panelOutput">

      <div class="output-toolbar">

        <button class="canvas-btn" id="zoomOutBtn" title="Zoom out">−</button>
        <button class="canvas-btn" id="zoomInBtn" title="Zoom in">+</button>

        <div class="canvas-divider"></div>

        <button class="canvas-btn" id="fitBtn" title="Fit to screen">⌗</button>

        <div class="canvas-divider"></div>

        <button class="canvas-btn" id="svgBtn" title="Export SVG">SVG</button>
        <button class="canvas-btn" id="pngBtn" title="Export PNG">PNG</button>

      </div>

      <div class="watermark">
        <img src="vexel.png" alt="">
      </div>

    </section>

    <!-- Console -->
    <section class="panel console-panel" id="panelConsole">

      <div class="console-header">
        <span class="console-title">Execution Console</span>
        <button class="console-clear" id="clearConsoleBtn">Clear console</button>
      </div>

      <div class="console-output" id="consoleOutput"></div>

    </section>

  </main>

  <!-- Status -->
  <footer class="statusbar">

    <div class="status-item">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusState">Ready</span>
    </div>

    <div class="status-item" id="statusShapes">0 shapes</div>
    <div class="status-item" id="statusZoom">100%</div>

    <div class="status-item status-right">
      Vexel Engine · v1.0
    </div>

  </footer>

</div>

<div class="toast" id="toast"></div>

<!-- Dependencies -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/spideythedev/vexel@main/dist/vexel.js"></script>

<script>
(() => {
  'use strict';

  const $ = (selector) => document.querySelector(selector);

  const elements = {
    loader: $('#loader'),
    output: $('#panelOutput'),
    console: $('#consoleOutput'),
    shapes: $('#statusShapes'),
    zoom: $('#statusZoom'),
    state: $('#statusState'),
    dot: $('#statusDot'),
    toast: $('#toast')
  };

  let vex = null;
  let editor = null;
  let toastTimer = null;
  let consoleLines = [];

  const MAX_LOGS = 300;

  /* Default program */

  const defaultCode = `// Vexel Playground
// Press Ctrl + Enter to execute.

vex.clear();
console.clear();

// Rectangle
vex.rectangle(40, 40, 220, 140, {
  fill: '#FF5722',
  stroke: '#1c1917',
  strokeWidth: 3,
  cornerRadius: 16
});

// Circle
vex.ellipse(340, 110, 65, 65, {
  fill: '#3B82F6',
  opacity: 0.85
});

// Triangle
vex.polygon(520, 110, 3, 55, {
  fill: '#22C55E'
});

// Dashed line
vex.line(40, 240, 640, 240, {
  stroke: '#1c1917',
  strokeWidth: 2,
  strokeDash: [8, 4]
});

// Custom path
vex.path([
  { x: 40, y: 300 },
  { x: 140, y: 270 },
  { x: 240, y: 330 },
  { x: 190, y: 390 },
  { x: 70, y: 370 }
], {
  fill: '#7C3AED',
  stroke: '#1c1917',
  strokeWidth: 2,
  closed: true
});

// Typography
vex.text(400, 330, 'Hello Vexel', {
  fontSize: 34,
  fontWeight: '800',
  fill: '#FF5722'
});

vex.text(400, 375, 'The Vector Graphics Engine', {
  fontSize: 12,
  fill: '#78716c',
  fontWeight: '500'
});

vex.zoomToFit();

console.log('Vexel is ready!');
console.log('Shapes:', vex.shapes.length);
`;

  /* Notifications */

  function toast(message) {
    elements.toast.textContent = message;
    elements.toast.classList.add('show');

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
      elements.toast.classList.remove('show');
    }, 2200);
  }

  /* Console */

  function formatValue(value) {
    if (typeof value === 'string') return value;

    if (value instanceof Error) {
      return value.stack || value.message;
    }

    if (value === undefined) return 'undefined';

    if (typeof value === 'function') {
      return value.toString();
    }

    try {
      const result = JSON.stringify(value);
      return result === undefined ? String(value) : result;
    } catch {
      return String(value);
    }
  }

  function addConsole(type, ...args) {
    const now = new Date();

    const timestamp = [
      now.getHours(),
      now.getMinutes(),
      now.getSeconds()
    ].map(v => String(v).padStart(2, '0')).join(':');

    consoleLines.push({
      type,
      timestamp,
      message: args.map(formatValue).join(' ')
    });

    if (consoleLines.length > MAX_LOGS) {
      consoleLines.shift();
    }

    renderConsole();
  }

  function renderConsole() {
    elements.console.replaceChildren();

    if (!consoleLines.length) {
      const empty = document.createElement('div');
      empty.className = 'console-line';

      const message = document.createElement('span');
      message.className = 'console-message';
      message.textContent = 'Console ready. Run your code to see output.';

      empty.appendChild(message);
      elements.console.appendChild(empty);
      return;
    }

    const fragment = document.createDocumentFragment();

    for (const item of consoleLines) {
      const line = document.createElement('div');
      line.className = `console-line ${item.type}`;

      const time = document.createElement('span');
      time.className = 'console-time';
      time.textContent = item.timestamp;

      const message = document.createElement('span');
      message.className = 'console-message';
      message.textContent = item.message;

      line.append(time, message);
      fragment.appendChild(line);
    }

    elements.console.appendChild(fragment);
    elements.console.scrollTop = elements.console.scrollHeight;
  }

  function clearConsole() {
    consoleLines = [];
    renderConsole();
  }

  const playgroundConsole = {
    log: (...args) => addConsole('log', ...args),
    info: (...args) => addConsole('info', ...args),
    warn: (...args) => addConsole('warn', ...args),
    error: (...args) => addConsole('error', ...args),
    debug: (...args) => addConsole('log', ...args),
    clear: clearConsole,
    table: (...args) => addConsole('log', ...args),
    group: (...args) => addConsole('log', ...args),
    groupEnd: () => {}
  };

  /* Status */

  function updateStatus() {
    if (!vex) return;

    elements.shapes.textContent =
      `${vex.shapes.length} shapes`;

    elements.zoom.textContent =
      `${Math.round(vex.viewport.zoom * 100)}%`;
  }

  function setState(state, error = false) {
    elements.state.textContent = state;
    elements.dot.classList.toggle('error', error);
  }

  /* Editor initialization */

  function initializeEditor() {
    if (typeof CodeMirror === 'undefined') {
      throw new Error('CodeMirror failed to load.');
    }

    editor = CodeMirror($('#editorContainer'), {
      value: defaultCode,
      mode: 'javascript',
      theme: 'material-darker',

      lineNumbers: true,
      styleActiveLine: true,
      matchBrackets: true,

      indentUnit: 2,
      tabSize: 2,
      indentWithTabs: false,
      lineWrapping: true,

      autofocus: false,

      extraKeys: {
        'Ctrl-Enter': runCode,
        'Cmd-Enter': runCode,
        'Ctrl-S': () => shareCode(),
        'Cmd-S': () => shareCode()
      }
    });
  }

  /* Engine initialization */

  function initializeEngine() {
    if (typeof Vexel === 'undefined') {
      throw new Error('Vexel engine failed to load. Check the CDN connection.');
    }

    vex = new Vexel({
      container: elements.output,

      width: Math.max(elements.output.clientWidth, 300),
      height: Math.max(elements.output.clientHeight, 200),

      grid: false
    });
  }

  /* Execute */

  function runCode() {
    if (!editor || !vex) return;

    clearConsole();
    setState('Running');

    addConsole('info', 'Executing playground.js');

    try {
      const source = editor.getValue();

      const execute = new Function(
        'vex',
        'console',
        '"use strict";\n' + source
      );

      execute(vex, playgroundConsole);

      updateStatus();
      setState('Ready');

      addConsole(
        'success',
        `Execution completed. ${vex.shapes.length} shapes rendered.`
      );

    } catch (error) {
      setState('Execution error', true);
      addConsole('error', error);
    }
  }

  /* Panels */

  function switchPanel(name) {
    document.querySelectorAll('.tab').forEach(button => {
      button.classList.toggle(
        'active',
        button.dataset.panel === name
      );
    });

    document.querySelectorAll('.panel').forEach(panel => {
      panel.classList.toggle(
        'active',
        panel.id === `panel${name[0].toUpperCase()}${name.slice(1)}`
      );
    });

    if (name === 'output' && vex) {
      requestAnimationFrame(() => {
        resizeEngine();
      });
    }

    if (name === 'code' && editor) {
      requestAnimationFrame(() => editor.refresh());
    }
  }

  function resizeEngine() {
    if (!vex) return;

    const width = elements.output.clientWidth;
    const height = elements.output.clientHeight;

    if (!width || !height) return;

    vex.resize(width, height);
    vex.dirty = true;

    updateStatus();
  }

  /* Sharing */

  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return;
    }

    const textarea = document.createElement('textarea');

    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';

    document.body.appendChild(textarea);
    textarea.select();

    const success = document.execCommand('copy');

    textarea.remove();

    if (!success) {
      throw new Error('Clipboard access failed.');
    }
  }

  async function shareCode() {
    if (!editor) return;

    const code = editor.getValue();

    try {
      const url = new URL(window.location.href);
      url.search = '';
      url.hash = '';

      url.searchParams.set('code', code);

      if (url.href.length > 100000) {
        throw new Error('Code is too large for a shareable URL.');
      }

      await copyText(url.href);

      toast('Share link copied to clipboard.');
    } catch (error) {
      toast(error.message || 'Unable to share code.');
    }
  }

  function loadSharedCode() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    if (code !== null) {
      editor.setValue(code);
      return true;
    }

    return false;
  }

  /* Formatting */

  function formatCode() {
    if (!editor) return;

    const cursor = editor.getCursor();

    editor.operation(() => {
      const lastLine = editor.lineCount() - 1;

      for (let i = 0; i <= lastLine; i++) {
        editor.indentLine(i, 'smart');
      }

      editor.setCursor(cursor);
    });

    toast('Indentation updated.');
  }

  /* New document */

  function newDocument() {
    if (!editor) return;

    if (
      editor.getValue() !== defaultCode &&
      !confirm('Start a new playground? Your current code will be replaced.')
    ) {
      return;
    }

    editor.setValue('vex.clear();\nconsole.clear();\n');

    clearConsole();
    runCode();

    switchPanel('code');
    toast('New playground created.');
  }

  /* Exports */

  function exportSVG() {
    if (!vex) return;

    try {
      const svg = vex.exportSVG();

      if (!svg) {
        throw new Error('SVG export returned no data.');
      }

      const blob = new Blob(
        [svg],
        { type: 'image/svg+xml;charset=utf-8' }
      );

      downloadBlob(blob, 'vexel-artwork.svg');

    } catch (error) {
      addConsole('error', 'SVG export failed:', error);
      toast('SVG export failed.');
    }
  }

  async function exportPNG() {
    if (!vex) return;

    try {
      const blob = await vex.exportPNG(2);

      if (!blob) {
        throw new Error('PNG export returned no data.');
      }

      downloadBlob(blob, 'vexel-artwork.png');

    } catch (error) {
      addConsole('error', 'PNG export failed:', error);
      toast('PNG export failed.');
    }
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');

    link.href = url;
    link.download = filename;

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);

    toast(`${filename} exported.`);
  }

  /* Event listeners */

  document.querySelectorAll('.tab').forEach(button => {
    button.addEventListener('click', () => {
      switchPanel(button.dataset.panel);
    });
  });

  $('#runBtn').addEventListener('click', runCode);
  $('#newBtn').addEventListener('click', newDocument);
  $('#formatBtn').addEventListener('click', formatCode);
  $('#shareBtn').addEventListener('click', shareCode);

  $('#clearConsoleBtn').addEventListener('click', clearConsole);

  $('#zoomInBtn').addEventListener('click', () => {
    if (!vex) return;
    vex.zoomIn();
    updateStatus();
  });

  $('#zoomOutBtn').addEventListener('click', () => {
    if (!vex) return;
    vex.zoomOut();
    updateStatus();
  });

  $('#fitBtn').addEventListener('click', () => {
    if (!vex) return;
    vex.zoomToFit();
    updateStatus();
  });

  $('#svgBtn').addEventListener('click', exportSVG);
  $('#pngBtn').addEventListener('click', exportPNG);

  document.addEventListener('keydown', event => {
    if (!(event.ctrlKey || event.metaKey)) return;

    if (event.key === '1') {
      switchPanel('code');
      event.preventDefault();
    }

    if (event.key === '2') {
      switchPanel('output');
      event.preventDefault();
    }

    if (event.key === '3') {
      switchPanel('console');
      event.preventDefault();
    }
  });

  let resizeFrame = null;

  window.addEventListener('resize', () => {
    cancelAnimationFrame(resizeFrame);

    resizeFrame = requestAnimationFrame(resizeEngine);
  });

  /* Start application */

  function initialize() {
    try {
      initializeEditor();
      initializeEngine();

      loadSharedCode();

      renderConsole();
      runCode();

      updateStatus();

      setTimeout(() => {
        elements.loader.classList.add('hidden');
        editor.refresh();
      }, 250);

    } catch (error) {
      elements.loader.classList.add('hidden');

      setState('Initialization error', true);
      addConsole('error', error);

      switchPanel('console');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initialize, { once: true });
  } else {
    initialize();
  }

})();
</script>

</body>
</html>
